name: Build AstralEmu Images

on:
  schedule:
    # Weekly build on Thursday 4AM UTC (after package builds on Sun/Wed)
    - cron: '0 4 * * 4'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force full rebuild (ignore cache)'
        required: false
        type: boolean
        default: false

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  # Job 1: Detect available images and their runners
  detect-images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Generate build matrix from images.txt + devices.yml
        id: matrix
        run: |
          # Build a JSON matrix with image name, runner, and build_format for each entry
          MATRIX_ENTRIES="[]"

          while IFS= read -r line; do
            # Skip comments and empty lines
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line// }" ]] && continue
            line=$(echo "$line" | xargs)

            # Extract device ID and distro ID
            DEVICE_ID=$(echo "$line" | cut -d'/' -f1)
            SLASH_COUNT=$(echo "$line" | tr -cd '/' | wc -c)

            # Determine distro ID from image name
            if [ "$SLASH_COUNT" -eq 2 ]; then
              DISTRO_ID=$(echo "$line" | cut -d'/' -f2)
            elif [ "$SLASH_COUNT" -eq 1 ]; then
              # Check if second part is a distro or services
              SECOND=$(echo "$line" | cut -d'/' -f2)
              IS_DISTRO=$(yq ".devices[] | select(.id == \"$DEVICE_ID\") | .distros[] | select(.id == \"$SECOND\") | .id" devices.yml 2>/dev/null || true)
              if [ -n "$IS_DISTRO" ] && [ "$IS_DISTRO" != "null" ]; then
                DISTRO_ID="$SECOND"
              else
                DISTRO_ID=$(yq ".devices[] | select(.id == \"$DEVICE_ID\") | .distros[0].id" devices.yml)
              fi
            else
              DISTRO_ID=$(yq ".devices[] | select(.id == \"$DEVICE_ID\") | .distros[0].id" devices.yml)
            fi

            # Look up runner and build_format
            RUNNER=$(yq ".devices[] | select(.id == \"$DEVICE_ID\") | .runner" devices.yml)
            BUILD_FORMAT=$(yq ".devices[] | select(.id == \"$DEVICE_ID\") | .distros[] | select(.id == \"$DISTRO_ID\") | .build_format" devices.yml)

            if [ -z "$RUNNER" ] || [ "$RUNNER" = "null" ]; then
              echo "WARNING: No runner found for device '$DEVICE_ID', skipping '$line'"
              continue
            fi

            # Default build_format to cloud-init if not specified
            BUILD_FORMAT=${BUILD_FORMAT:-cloud-init}

            # Add to matrix
            MATRIX_ENTRIES=$(echo "$MATRIX_ENTRIES" | jq --arg img "$line" --arg runner "$RUNNER" --arg fmt "$BUILD_FORMAT" '. + [{"image": $img, "runner": $runner, "build_format": $fmt}]')
          done < .github/images.txt

          MATRIX=$(echo "{\"include\": $MATRIX_ENTRIES}" | jq -c .)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Build matrix:"
          echo "$MATRIX" | jq .

  # Job 2: Stage 1+2 - Download and Setup (parallel for all images)
  # For cloud-init/tarball: QEMU setup
  # For docker (ublue): podman build + bootc-image-builder
  stage1-2-build:
    needs: detect-images
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJSON(needs.detect-images.outputs.matrix) }}
      fail-fast: false
      max-parallel: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate sanitized artifact name
        id: artifact
        run: |
          # Replace / and + with - for artifact names
          SANITIZED=$(echo "${{ matrix.image }}" | tr '/+' '--')
          echo "name=${SANITIZED}" >> $GITHUB_OUTPUT
          echo "Artifact name: ${SANITIZED}"
          echo "build_format=${{ matrix.build_format }}" >> $GITHUB_OUTPUT

      - name: Free disk space
        run: |
          # Free up disk space for large images
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Install dependencies (QEMU builds)
        if: matrix.build_format != 'docker'
        run: |
          sudo apt update
          sudo apt install -y \
            wget \
            genisoimage \
            xz-utils \
            qemu-utils

          # Install yq
          ARCH=$(dpkg --print-architecture)
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${ARCH}"
          sudo chmod +x /usr/local/bin/yq

          # Install QEMU system emulation
          DEVICE_ARCH=$(yq ".devices[] | select(.id == \"$(echo '${{ matrix.image }}' | cut -d'/' -f1)\") | .arch" devices.yml)
          HOST_ARCH=$(dpkg --print-architecture)
          if [ "$HOST_ARCH" = "$DEVICE_ARCH" ] || { [ "$HOST_ARCH" = "arm64" ] && [ "$DEVICE_ARCH" = "arm64" ]; }; then
            echo "Native arch build - QEMU will use KVM acceleration"
            sudo apt install -y qemu-system-aarch64 qemu-efi-aarch64
          else
            echo "Cross-arch build - installing full QEMU emulation"
            sudo apt install -y qemu-system-aarch64 qemu-efi-aarch64
          fi

      - name: Install dependencies (OCI/bootc builds)
        if: matrix.build_format == 'docker'
        run: |
          sudo apt update
          sudo apt install -y wget xz-utils

          # Install yq
          ARCH=$(dpkg --print-architecture)
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${ARCH}"
          sudo chmod +x /usr/local/bin/yq

          # Install podman
          echo "Installing podman for OCI build..."
          sudo apt install -y podman || {
            # Fallback: install from official repo if distro package is too old
            sudo mkdir -p /etc/apt/keyrings
            curl -fsSL https://download.opensuse.org/repositories/devel:kubic:libcontainers:unstable/xUbuntu_$(lsb_release -rs)/Release.key | gpg --dearmor -o /etc/apt/keyrings/podman-archive-keyring.gpg
            echo "deb [signed-by=/etc/apt/keyrings/podman-archive-keyring.gpg] https://download.opensuse.org/repositories/devel:kubic:libcontainers:unstable/xUbuntu_$(lsb_release -rs)/ /" | sudo tee /etc/apt/sources.list.d/podman.list
            sudo apt update
            sudo apt install -y podman
          }

          # Pre-pull bootc-image-builder container (saves time during build)
          sudo podman pull quay.io/centos-bootc/bootc-image-builder:latest || true

      - name: Fetch astralemu-packages device definitions
        run: |
          wget -q "https://raw.githubusercontent.com/AstralEmu/astralemu-packages/refs/heads/main/devices.yml" -O .packages-devices.yml
          echo "Remote devices.yml fetched (power scores for cache invalidation)"

      - name: Cache base images (QEMU builds)
        if: matrix.build_format != 'docker'
        uses: actions/cache@v4
        with:
          path: |
            *.raw
            *.img
            *.tar.gz
            !work-image.raw
          key: base-images-${{ hashFiles('devices.yml') }}
          restore-keys: |
            base-images-

      - name: Restore cached work-image (QEMU builds)
        id: cache-work
        if: matrix.build_format != 'docker' && inputs.force_rebuild != true
        uses: actions/cache/restore@v4
        with:
          path: work-image.raw
          key: work-image-${{ steps.artifact.outputs.name }}-${{ hashFiles('devices.yml', 'bin/autobuild', '.packages-devices.yml', 'devices/**/setup.sh', 'devices/**/packages.yml', 'devices/**/config.sh', 'services/**/setup.sh', 'services/**/packages.yml') }}

      - name: Full build - Stage 1+2 QEMU (cache miss or force rebuild)
        if: matrix.build_format != 'docker' && (steps.cache-work.outputs.cache-hit != 'true' || inputs.force_rebuild == true)
        run: |
          ./bin/autobuild --image "${{ matrix.image }}" --stage 1
          ./bin/autobuild --image "${{ matrix.image }}" --stage 2
        timeout-minutes: 90

      - name: Upgrade only (cache hit, QEMU builds)
        if: matrix.build_format != 'docker' && steps.cache-work.outputs.cache-hit == 'true' && inputs.force_rebuild != true
        run: |
          echo "Cache hit - skipping full build, upgrading packages only"
          ./bin/autobuild --image "${{ matrix.image }}" --upgrade-only --stage 2

      - name: Full build - OCI (docker/bootc format)
        if: matrix.build_format == 'docker'
        run: |
          ./bin/autobuild --image "${{ matrix.image }}" --stage 1
          ./bin/autobuild --image "${{ matrix.image }}" --stage 2
        timeout-minutes: 120

      - name: Save work-image to cache (QEMU builds)
        if: matrix.build_format != 'docker' && (steps.cache-work.outputs.cache-hit != 'true' || inputs.force_rebuild == true) && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: work-image.raw
          key: work-image-${{ steps.artifact.outputs.name }}-${{ hashFiles('devices.yml', 'bin/autobuild', '.packages-devices.yml', 'devices/**/setup.sh', 'devices/**/packages.yml', 'devices/**/config.sh', 'services/**/setup.sh', 'services/**/packages.yml') }}

      - name: Clean up unnecessary files before upload
        if: ${{ !cancelled() }}
        run: |
          # Keep only the files needed for output stage
          echo "Files before cleanup:"
          ls -lh *.img *.raw 2>/dev/null || true

          # Remove setup.iso and seed.img if they exist (not needed after build)
          rm -f setup.iso seed.img

          # Remove downloaded base image (already copied to work-image.raw)
          find . -maxdepth 1 -name "*.qcow2" -delete

          echo ""
          echo "Files after cleanup (ready for upload):"
          ls -lh *.img *.raw 2>/dev/null || true

      - name: Upload work image and device-specific files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: images-ready-${{ steps.artifact.outputs.name }}
          path: |
            work-image.raw
            *.img
          retention-days: 1
          compression-level: 0

  # Job 3: Create Release (runs in parallel with build stages)
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release_info.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Determine build type
        id: build_type
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "type=cron" >> $GITHUB_OUTPUT
            echo " Cron build detected - will create/update daily release"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "type=push" >> $GITHUB_OUTPUT
            echo " Push build detected - will create new release with changelog"
          else
            echo "type=manual" >> $GITHUB_OUTPUT
            echo " Manual build detected - will create new release"
          fi

      - name: Generate release name and tag
        id: release_info
        run: |
          RELEASE_DATE=$(date +'%Y-%m-%d')
          RELEASE_TIME=$(date +'%H%M')

          # Determine if it's a pre-release
          if [ "${{ github.ref_name }}" = "main" ]; then
            IS_PRERELEASE="false"
          else
            IS_PRERELEASE="true"
          fi

          if [ "${{ steps.build_type.outputs.type }}" = "cron" ]; then
            RELEASE_TAG="daily-${RELEASE_DATE}"
            RELEASE_NAME="Daily Build ${RELEASE_DATE}"
          else
            if [ "$IS_PRERELEASE" = "false" ]; then
              RELEASE_TAG="v${RELEASE_DATE}-${RELEASE_TIME}"
              RELEASE_NAME="Release ${RELEASE_DATE}"
            else
              RELEASE_TAG="v${RELEASE_DATE}-${RELEASE_TIME}-${{ github.ref_name }}"
              RELEASE_NAME="Pre-release ${RELEASE_DATE} (${{ github.ref_name }})"
            fi
          fi

          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "date=${RELEASE_DATE}" >> $GITHUB_OUTPUT
          echo "time=${RELEASE_TIME}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: |
          LAST_TAG=$(gh release list --json tagName --jq '[.[] | select(.tagName | startswith("daily-") | not)][0].tagName' 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:'- %s (`%h`)' --no-merges -20)
          else
            CHANGELOG=$(git log ${LAST_TAG}..HEAD --pretty=format:'- %s (`%h`)' --no-merges)
          fi

          if [ -z "$CHANGELOG" ]; then
            echo "No new commits since last build." > changelog.md
          else
            echo "$CHANGELOG" > changelog.md
          fi

          echo "Changelog:"
          cat changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release body
        run: |
          cat > release_body.md << 'BANNER'
          <p align="center">
            <img src="https://github.com/AstralEmu/.github/raw/refs/heads/main/profile/banner-astralemu.svg" alt="AstralEmu" width="100%"/>
          </p>

          BANNER

          echo "# ${{ steps.release_info.outputs.name }}" >> release_body.md

          if [ "${{ steps.release_info.outputs.prerelease }}" = "true" ]; then
            echo "> **Pre-release (\`${{ github.ref_name }}\`)** — These images may be unstable. For stable images, use releases from \`main\`." >> release_body.md
            echo "" >> release_body.md
          fi

          {
            echo ""
            echo "## Changelog"
            echo ""
            cat changelog.md
            echo ""
            echo "---"
            echo ""
          } >> release_body.md

          cat >> release_body.md << 'FOOTER'
          <p align="center">
            <a href="https://github.com/AstralEmu/astralemu">Main Repo</a> &
            <a href="https://astralemu.github.io">Documentation</a> &
            <a href="https://github.com/orgs/AstralEmu/discussions">Community</a>
          </p>
          FOOTER

      - name: Delete previous daily release
        if: steps.build_type.outputs.type == 'cron'
        run: |
          OLD_DAILY=$(gh release list --json tagName --jq '[.[] | select(.tagName | startswith("daily-"))][0].tagName' 2>/dev/null || echo "")
          if [ -n "$OLD_DAILY" ]; then
            echo "Deleting previous daily release $OLD_DAILY..."
            gh release delete "$OLD_DAILY" --yes --cleanup-tag
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        id: create_release
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ steps.release_info.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create ${{ steps.release_info.outputs.tag }} \
            --title "${{ steps.release_info.outputs.name }}" \
            --notes-file release_body.md \
            $PRERELEASE_FLAG

          echo "Release ${{ steps.release_info.outputs.tag }} created successfully"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 4: Stage 3 - Run output format modules + upload (parallel for all images)
  stage3-output:
    needs: [detect-images, stage1-2-build, create-release]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJSON(needs.detect-images.outputs.matrix) }}
      fail-fast: false
      max-parallel: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate sanitized artifact name
        id: artifact
        run: |
          SANITIZED=$(echo "${{ matrix.image }}" | tr '/+' '--')
          echo "name=${SANITIZED}" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            parted \
            e2fsprogs \
            dosfstools \
            rsync \
            qemu-utils \
            squashfs-tools \
            xz-utils

          ARCH=$(dpkg --print-architecture)
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${ARCH}"
          sudo chmod +x /usr/local/bin/yq

      - name: Enable loop devices
        run: |
          sudo modprobe loop
          ls -la /dev/loop* || true

      - name: Download images from stage 1+2
        uses: actions/download-artifact@v6
        with:
          name: images-ready-${{ steps.artifact.outputs.name }}

      - name: Stage 3 - Run output format for ${{ matrix.image }}
        run: |
          ./bin/autobuild --image "${{ matrix.image }}" --stage 3

      - name: Upload to release
        if: ${{ !cancelled() }}
        run: |
          UPLOADED=0
          for f in *.img.xz *.tar.gz *.7z; do
            if [ -f "$f" ]; then
              gh release upload ${{ needs.create-release.outputs.tag }} "$f" --clobber
              echo "Uploaded $f to release"
              UPLOADED=$((UPLOADED + 1))
            fi
          done

          if [ "$UPLOADED" -eq 0 ]; then
            echo "WARNING: No output files found to upload"
            ls -la
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          sudo rm -f *.img *.img.xz *.raw *.squashfs *.tar.gz *.7z
          df -h

  # Job 5: Cleanup empty release (runs after all builds complete or fail)
  cleanup-release:
    needs: [create-release, stage3-output]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check release and delete if empty
        run: |
          RELEASE_TAG="${{ needs.create-release.outputs.tag }}"

          echo "Checking release $RELEASE_TAG for assets..."

          ASSET_COUNT=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length' 2>/dev/null || echo "0")

          echo "Release has $ASSET_COUNT asset(s)"

          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "Release $RELEASE_TAG is empty (no assets uploaded)"
            echo "Deleting empty release..."
            gh release delete "$RELEASE_TAG" --yes
            echo "Empty release deleted successfully"
          else
            echo "Release $RELEASE_TAG has $ASSET_COUNT asset(s), keeping it"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}